name: short_video_kit
description: >-
  Drop-in short video capture for Flutter: record a duration-limited clip or
  pick & trim one from the gallery, then preview it — permissions handled.
version: 0.1.1
repository: https://github.com/dearsikandarkhan/flutter_video_15seconds
issue_tracker: https://github.com/dearsikandarkhan/flutter_video_15seconds/issues
homepage: https://github.com/dearsikandarkhan/flutter_video_15seconds

topics:
  - video
  - camera
  - video-editing
  - media
  - trimmer

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ">=0.11.0 <0.13.0"
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_trimmer: ">=3.0.1 <6.0.0"
  path_provider: ^2.0.15
  permission_handler: ">=11.3.1 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
