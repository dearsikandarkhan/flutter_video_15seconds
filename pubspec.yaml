name: short_video_kit
description: >-
  Drop-in TikTok/Reels-style short video capture for Flutter. Record a
  duration-limited clip or pick & trim one from the gallery, then preview it —
  in a few lines, with permissions and lifecycle handled for you.
version: 0.1.0
repository: https://github.com/dearsikandarkhan/flutter_video_15seconds
issue_tracker: https://github.com/dearsikandarkhan/flutter_video_15seconds/issues
homepage: https://github.com/dearsikandarkhan/flutter_video_15seconds

topics:
  - video
  - camera
  - video-editing
  - media
  - trimmer

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_trimmer: ^3.0.1
  path_provider: ^2.0.15
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
